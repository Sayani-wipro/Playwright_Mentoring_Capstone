name: Playwright Tests
on:
  push:
    branches: [ main, master, lab2 ]
  pull_request:
    branches: [ main, master, lab2 ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://www.saucedemo.com
      S_USERNAME: ${{ secrets.S_USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      CHECKOUT_FIRST_NAME: ${{ secrets.CHECKOUT_FIRST_NAME }}
      CHECKOUT_LAST_NAME: ${{ secrets.CHECKOUT_LAST_NAME }}
      CHECKOUT_POSTAL_CODE: ${{ secrets.CHECKOUT_POSTAL_CODE }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload test results (screenshots, videos, traces)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
